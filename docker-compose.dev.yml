services:
  uploader-base:
    build:
      context: .
      dockerfile: Dockerfile.base
    image: uploader-base

  redis:
    image: redis:alpine
    container_name: redis-dev
    ports:
      - '6379:6379'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app-network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.api
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - '3001:3001'
      - '9229:9229'
    volumes:
      # Mount source code for hot reloading (but not node_modules or generated files)
      - ./apps/api/src:/app/apps/api/src
      - ./turbo.json:/app/turbo.json:ro
      - ./package.json:/app/package.json:ro
      # IMPORTANT: Preserve container's node_modules
      - /app/node_modules
      - /app/apps/api/node_modules
      # Mount database package for dev
      - ./packages/database:/app/packages/database
      - /app/packages/database/node_modules
    env_file:
      - apps/api/.env
    environment:
      - NODE_ENV=development
    # Use the dev script defined in package.json instead of direct nest command
    command: ['sh', '-c', 'rm -rf apps/api/dist && pnpm --filter=api run dev']
    stdin_open: true
    tty: true
    depends_on:
      - uploader-base
      - redis
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3001/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    restart: unless-stopped
    networks:
      - app-network

  post-worker:
    build:
      context: .
      dockerfile: apps/post-worker/Dockerfile.post-worker
    dns:
      - 8.8.8.8
      - 8.8.4.4
    volumes:
      # Mount source code for hot reloading
      - ./apps/post-worker/src:/app/apps/post-worker/src
      # IMPORTANT: Preserve container's node_modules
      - /app/node_modules
      - /app/apps/post-worker/node_modules
      # Mount database package for dev
      - ./packages/database:/app/packages/database
      - /app/packages/database/node_modules
    env_file:
      - apps/post-worker/.env
    environment:
      - NODE_ENV=development
    # Use the dev script defined in package.json
    command: ['pnpm', '--filter=post-worker', 'run', 'dev']
    stdin_open: true
    tty: true
    depends_on:
      - uploader-base
      - redis
    restart: unless-stopped
    networks:
      - app-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.web
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - '3000:3000'
    volumes:
      # Mount source code for hot reloading
      - ./apps/web:/app/apps/web
      - ./turbo.json:/app/turbo.json:ro
      - ./package.json:/app/package.json:ro
      # IMPORTANT: Preserve container's node_modules
      - /app/node_modules
      - /app/apps/web/node_modules
      # Mount database package for dev
      - ./packages/database:/app/packages/database
      - /app/packages/database/node_modules
    env_file:
      - apps/web/.env
    environment:
      - NODE_ENV=development
    command: ['pnpm', '--filter=web', 'run', 'dev']
    stdin_open: true
    tty: true
    depends_on:
      - uploader-base
      - api
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
